name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run unit, integration and cryptographic tests
        working-directory: helixstreet-agent
        env:
          HELIX_DATA_DIR: ${{ runner.temp }}/helixstreet-data
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider

  front-door:
    name: Caddy config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: caddy validate
        run: >-
          docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
